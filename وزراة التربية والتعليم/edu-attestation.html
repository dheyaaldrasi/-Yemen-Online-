<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <title>تصديق الشهادات</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="css/all.min.css">
</head>

<body>
    <header class="top-header">
        <div class="logo-area">
            <img
                src="images/Yemen.png">
            <div>
                <h1>بوابة الخدمات الحكومية الالكترونية</h1>
            </div>
        </div>
    </header>
    <nav class="main-nav">
        <ul>
            <li><a href="index.html">وزارة التربية والتعليم</a></li>
        </ul>
    </nav>

    <div class="breadcrumb"><a href="index.html">الرئيسية</a> > <span>تصديق الشهادات</span></div>

    <main class="service-container">
        <div class="form-area">
            <div class="form-header">
                <div>
                    <h3>تصديق الشهادات</h3>
                    <p>للاعتماد لدى وزارة الخارجية أو الجهات الأخرى.</p>
                </div>
                <i class="fa-solid fa-stamp"></i>
            </div>
            <form class="form-grid">
                <div class="input-group">
                    <label>نوع الشهادة المراد تصديقها <span>*</span></label>
                    <select>
                        <option>شهادة ثانوية عامة</option>
                        <option>شهادة أساسي</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>الجهة الموجه إليها التصديق <span>*</span></label>
                    <select>
                        <option>وزارة الخارجية (للسفر)</option>
                        <option>جامعة محلية</option>
                    </select>
                </div>
                <div class="input-group full-width">
                    <label>إرفاق صورة الشهادة الأصلية (PDF/JPG) <span>*</span></label>
                    <input type="file" required style="padding: 9px;">
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn-submit">رفع الطلب <i
                            class="fa-solid fa-cloud-arrow-up"></i></button>
                </div>
            </form>
        </div>
        <aside class="sidebar">
            <div class="side-card">
                <h4><i class="fa-solid fa-list-check"></i> المتطلبات</h4>
                <p>يجب إحضار أصل الشهادة عند المراجعة لمطابقتها.</p>
            </div>
        </aside>
    </main>
</body>

</html>
