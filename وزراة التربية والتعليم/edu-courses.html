<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <title>المقرر الدراسي</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="css/all.min.css">
</head>

<body>
    <header class="top-header">
        <div class="logo-area">
            <img
                src="images/Yemen.png">
            <div>
                <h1>بوابة الخدمات الحكومية الالكترونية</h1>
            </div>
        </div>
    </header>
    <nav class="main-nav">
        <ul>
            <li><a href="index.html">وزارة التربية والتعليم</a></li>
        </ul>
    </nav>

    <div class="breadcrumb"><a href="index.html">الرئيسية</a> > <span>الاستعلام عن المقرر الدراسي</span></div>

    <main class="service-container">
        <div class="form-area">
            <div class="form-header">
                <div>
                    <h3>الاستعلام عن المقرر الدراسي</h3>
                    <p>تعرف على المواد الدراسية والخطط المعتمدة.</p>
                </div>
                <i class="fa-solid fa-book-open-reader"></i>
            </div>
            <form class="form-grid">
                <div class="input-group">
                    <label>المرحلة الدراسية <span>*</span></label>
                    <select>
                        <option>المرحلة الأساسية</option>
                        <option>المرحلة الثانوية</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>الصف الدراسي <span>*</span></label>
                    <select>
                        <option>الأول الثانوي</option>
                        <option>الثاني الثانوي</option>
                        <option>الثالث الثانوي</option>
                    </select>
                </div>
                <div class="input-group full-width">
                    <label>الفصل الدراسي <span>*</span></label>
                    <select>
                        <option>الفصل الدراسي الأول</option>
                        <option>الفصل الدراسي الثاني</option>
                    </select>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn-submit">عرض المقررات <i class="fa-solid fa-eye"></i></button>
                </div>
            </form>
        </div>
        <aside class="sidebar">
            <div class="side-card">
                <h4><i class="fa-solid fa-download"></i> تحميل الكتب</h4>
                <p>بعد الاستعلام، سيظهر لك رابط لتحميل الكتب بصيغة PDF.</p>
            </div>
        </aside>
    </main>
</body>

</html>
